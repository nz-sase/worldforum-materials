<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>シスラボ 配布資料</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ribbon">
  <div class="ribbon-inner">
    <a class="logos" href="https://www.syslabo.com/" target="_blank" rel="noopener"><img class="logo" src="SyslaboLogo.svg" alt="SYSLABO"></a>
    <button class="dl-all mail-btn" type="button"></button>
  </div>
</div>

<div class="wrap">
  <header>
    <span class="event" id="eventName"></span>
    <h1>配布資料一覧</h1>
    <p class="lead">弊社ブースにお立ち寄りいただき、誠にありがとうございます。</p>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
    <input class="search" id="q" type="search" placeholder="キーワードで探す" aria-label="キーワード検索">
  </div>

  <section id="pickup-sec">
    <div class="sec-head"><h2>まずはこちらから</h2></div>
    <div class="grid" id="pickup"></div>
  </section>

  <section>
    <div class="sec-head"><h2 id="list-title">すべての資料</h2><span class="count" id="count"></span></div>
    <div class="grid" id="list"></div>
    <p class="empty" id="empty" hidden>該当する資料がありません。</p>
  </section>

  <section id="partner-sec" class="partner">
    <a class="partner-logo" href="https://now-tech.jp/" target="_blank" rel="noopener"><img src="NowTechLogo.svg" alt="NowTech"></a>
    <div class="sec-head"><h2 id="partnerTitle"></h2></div>
    <p class="partner-lead" id="partnerLead"></p>
    <div class="grid" id="partner"></div>
  </section>

  <footer id="footNote"></footer>
</div>

<!-- 「メールで自分に送る」のフォーム。送信すると Power Automate が資料のZIPを添付したメールを送る -->
<dialog class="modal" id="mailModal" aria-labelledby="mailModalTitle">
  <div class="modal-head">
    <h2 id="mailModalTitle">全ての資料をメールで受け取る</h2>
    <button class="modal-close" id="mailClose" type="button" aria-label="閉じる">×</button>
  </div>
  <form class="mail-form" id="mailForm" novalidate>
    <p class="mail-lead">ご入力いただいたメールアドレスに、全ての資料をまとめたZIPファイルをお送りします。</p>
    <div class="field">
      <label for="fName"><span class="tag tag-req">必須</span>お名前</label>
      <input id="fName" name="name" type="text" autocomplete="name" placeholder="（例）山田 太郎">
    </div>
    <div class="field">
      <label for="fCompany"><span class="tag">任意</span>会社名</label>
      <input id="fCompany" name="company" type="text" autocomplete="organization" placeholder="（例）株式会社サンプル">
    </div>
    <div class="field">
      <label for="fEmail"><span class="tag tag-req">必須</span>メールアドレス</label>
      <input id="fEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="（例）info@sample.co.jp">
    </div>
    <div class="field">
      <label for="fEmail2"><span class="tag tag-req">必須</span>メールアドレス（確認）</label>
      <input id="fEmail2" name="email2" type="email" autocomplete="off" inputmode="email" placeholder="もう一度入力してください">
    </div>
    <!-- ボット対策。人には見えない欄で、ここに何か入っていたら送らない -->
    <div class="hp" aria-hidden="true">
      <label>この欄は空のままにしてください<input name="website" type="text" tabindex="-1" autocomplete="off"></label>
    </div>
    <label class="agree">
      <input name="agree" type="checkbox">
      <span><a href="https://www.syslabo.com/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する</span>
    </label>
    <p class="mail-error" id="mailError" role="alert" hidden></p>
    <button class="mail-submit" id="mailSubmit" type="submit">送信する</button>
  </form>
  <div class="mail-done" id="mailDone" hidden>
    <p class="mail-done-title">送信しました</p>
    <p>ご入力いただいたメールアドレスに、資料を添付したメールをお送りしました。数分たっても届かない場合は、迷惑メールフォルダもご確認ください。</p>
  </div>
</dialog>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/main.js"></script>
</body>
</html>
